<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio // T-800</title>
  <meta name="description" content="Terminator-themed portfolio hero section — terracotta and black." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #fffa62;
      --paper: #f9d921;
      --black: #0A0A0A;
      --black2: #111111;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      font-family: 'Share Tech Mono', monospace;
      color: var(--black);
    }

    /* ────────────────────────────────
       HERO WRAPPER
    ──────────────────────────────── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── black accent stripe — left edge ── */
    .stripe-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: var(--black);
      z-index: 5;
    }

    /* ── top border ── */
    .stripe-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--black);
      z-index: 5;
    }

    /* ────────────────────────────────
       NAV BAR (top-left)
    ──────────────────────────────── */
    nav {
      position: absolute;
      top: 24px;
      left: 24px;
      height: auto;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      z-index: 30;
      background: var(--black);
      border-radius: 14px;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      list-style: none;
      margin: 0;
    }

    .nav-links a {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: rgba(217, 108, 63, 0.7);
      text-decoration: none;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 8px;
      transition: background 0.25s, color 0.25s;
    }

    .nav-links a:hover {
      background: rgba(217, 108, 63, 0.12);
      color: var(--accent);
    }

    /* ────────────────────────────────
       MAIN CONTENT — centred vertically
    ──────────────────────────────── */
    .hero-content {
      position: absolute;
      top: 50%;
      left: 6px;
      right: 0;
      transform: translateY(-50%);
      padding: 0 56px;
      z-index: 10;
    }

    /* eyebrow */
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 6px;
      color: var(--black);
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 20px;
      opacity: 0;
      animation: slideIn 0.7s 0.2s ease forwards;
    }

    /* CHUNKY main heading */
    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 10vw, 9rem);
      line-height: 0.9;
      color: var(--black);
      text-transform: uppercase;
      letter-spacing: -2px;
      opacity: 0;
      animation: slideIn 0.8s 0.35s ease forwards;
    }

    .hero-title em {
      font-style: normal;
      /* outlined / ghost text */
      -webkit-text-stroke: 3px var(--black);
      color: transparent;
    }

    /* descriptor row */
    .hero-desc {
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      opacity: 0;
      animation: slideIn 0.8s 0.55s ease forwards;
    }

    .hero-desc-line {
      width: 60px;
      height: 3px;
      background: var(--black);
      flex-shrink: 0;
    }

    .hero-desc p {
      font-size: 0.78rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--black);
      opacity: 0.6;
    }



    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ────────────────────────────────
       BIG NUMBER — bottom left
    ──────────────────────────────── */
    .big-number {
      position: absolute;
      bottom: -20px;
      left: 0;
      z-index: 5;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(10rem, 22vw, 22rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(0, 0, 0, 0.12);
      letter-spacing: -8px;
      user-select: none;
      pointer-events: none;
      padding-left: 6px;
    }

    /* ────────────────────────────────
       SOCIAL LINKS — bottom right, horizontal
    ──────────────────────────────── */
    .social-bar {
      position: absolute;
      bottom: 28px;
      right: 28px;
      z-index: 30;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      background: var(--black);
      border-radius: 14px;
      padding: 8px 12px;
    }

    .social-link {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      color: rgba(217, 108, 63, 0.7);
      text-decoration: none;
      transition: background 0.25s, color 0.25s;
    }

    .social-link:hover {
      background: rgba(217, 108, 63, 0.12);
      color: var(--accent);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ────────────────────────────────
       BOTTOM TICKER
    ──────────────────────────────── */
    .ticker-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: var(--black);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 20;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      animation: ticker 22s linear infinite;
    }

    .ticker-item {
      font-size: 0.6rem;
      letter-spacing: 4px;
      color: var(--accent);
      opacity: 0.6;
      padding: 0 48px;
      text-transform: uppercase;
    }

    .ticker-item span {
      opacity: 1;
      margin: 0 12px;
      color: var(--accent);
    }

    @keyframes ticker {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

  <section class="hero" id="hero">

    <!-- Edge stripes -->
    <div class="stripe-left"></div>
    <div class="stripe-top"></div>

    <!-- ── NAV TOP LEFT ── -->
    <nav id="main-nav">
      <ul class="nav-links">
        <li><a href="#about" id="nav-about">Mission</a></li>
        <li><a href="#work" id="nav-work">Arsenal</a></li>
        <li><a href="#skills" id="nav-skills">Protocol</a></li>
        <li><a href="#contact" id="nav-contact">Contact</a></li>
      </ul>
    </nav>

    <!-- ── HERO CONTENT ── -->
    <div class="hero-content">
      <h1 class="hero-title">
        MAKE<br />
        <em>IT</em><br />
        WORK.
      </h1>
      <div class="hero-desc">
        <div class="hero-desc-line"></div>
        <p>Full-Stack Engineer &nbsp;·&nbsp; Systems Architect &nbsp;·&nbsp; Builder</p>
      </div>
    </div>

    <!-- ── BIG NUMBER BOTTOM LEFT ── -->
    <div class="big-number" aria-hidden="true">01</div>

    <div class="social-bar" id="social-links">

    </div>



  </section>

</body>

</html>
